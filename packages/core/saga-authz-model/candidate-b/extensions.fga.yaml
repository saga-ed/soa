name: candidate-b v1.2 / extensions beyond the original six use cases
model_file: ./model.fga
tuples:
  # --- base tuples copied verbatim from balt.fga.yaml ---
  - {user: saga_platform:root, relation: platform, object: staff_org:balt}
  - {user: staff_org:balt, relation: org, object: district:balt}
  - {user: district:balt, relation: parent_district, object: program:p1}
  - {user: district:balt, relation: parent_district, object: program:p2}
  - {user: program:p1, relation: program, object: school:p1-s1}
  - {user: program:p1, relation: program, object: school:p1-s2}
  - {user: program:p2, relation: program, object: school:p2-s2}
  - {user: program:p2, relation: program, object: school:p2-s3}
  - {user: program:p1, relation: parent_program, object: pod:a}
  - {user: program:p1, relation: parent_program, object: pod:b}
  - {user: program:p2, relation: parent_program, object: pod:c}
  - {user: program:p2, relation: parent_program, object: pod:d}
  - {user: pod:a, relation: parent_pod, object: session:a1}
  - {user: user:t1, relation: host, object: session:a1}
  - {user: pod:b, relation: parent_pod, object: session:b1}
  - {user: user:t2, relation: host, object: session:b1}
  - {user: pod:c, relation: parent_pod, object: session:c1}
  - {user: user:t2, relation: host, object: session:c1}
  - {user: pod:d, relation: parent_pod, object: session:d1}
  - {user: user:t3, relation: host, object: session:d1}
  - {user: pod:a, relation: parent_pod, object: session:x1}   # override: t3 (from p2) hosts a p1 session
  - {user: user:t3, relation: host, object: session:x1}
  - {user: user:dana, relation: can_edit, object: district:balt}
  - {user: user:ines, relation: can_edit, object: program:p1}
  - {user: user:ines, relation: supervise_view, object: program:p1}
  - {user: user:ivan, relation: can_edit, object: program:p1}
  - {user: user:ivan, relation: supervise_view, object: program:p1}
  - {user: user:ivan, relation: can_edit, object: program:p2}
  - {user: user:ivan, relation: supervise_view, object: program:p2}
  - {user: user:sam, relation: can_coordinate, object: school:p1-s1}
  - {user: user:sue, relation: can_coordinate, object: school:p1-s2}
  - {user: user:sue, relation: can_coordinate, object: school:p2-s2}
  - {user: user:t1, relation: default_host, object: pod:a}
  - {user: user:t2, relation: default_host, object: pod:b}
  - {user: user:t2, relation: default_host, object: pod:c}
  - {user: user:t3, relation: default_host, object: pod:d}
  - {user: user:t1, relation: affiliate, object: district:balt}
  - {user: user:t2, relation: affiliate, object: district:balt}
  - {user: user:t3, relation: affiliate, object: district:balt}
  - {user: user:pat, relation: support, object: saga_platform:root}
  - {user: user:oscar, relation: org_admin, object: saga_platform:root}
  - {user: user:t1, relation: participant, object: program:p1}
  - {user: user:t2, relation: participant, object: program:p1}
  - {user: user:t2, relation: participant, object: program:p2}
  - {user: user:t3, relation: participant, object: program:p2}
  - {user: user:sam, relation: participant, object: program:p1}
  - {user: user:sue, relation: participant, object: program:p1}
  - {user: user:sue, relation: participant, object: program:p2}
  - {user: program:p1, relation: parent_program_as_tutor, object: coach_progress:t1}
  - {user: user:t1, relation: subject, object: coach_progress:t1}
  - {user: program:p1, relation: parent_program_as_tutor, object: coach_progress:t2}
  - {user: user:t2, relation: subject, object: coach_progress:t2}
  - {user: program:p2, relation: parent_program_as_tutor, object: coach_progress:t2}
  - {user: program:p1, relation: parent_program_as_coordinator, object: coach_progress:sam}
  - {user: user:sam, relation: subject, object: coach_progress:sam}
  - {user: user:ines, relation: can_view_coaching_of_tutors, object: program:p1}
  - {user: user:ines, relation: can_view_coaching_of_coordinators, object: program:p1}
  - {user: school:p1-s1, relation: parent_school, object: grade_upload:g-p1s1-001}
  - {user: school:p1-s2, relation: parent_school, object: grade_upload:g-p1s2-001}
  - {user: school:p2-s2, relation: parent_school, object: grade_upload:g-p2s2-001}

  # --- extension tuples: relations v1/v1.1 added beyond the original six use cases ---
  # EXT-CV3-1/EXT-PH-3 -> session.participant (materialized)
  - {user: user:cara, relation: participant, object: session:a1}
  # EXT-PH-4 -> program.can_observe_sessions (renamed from `observer`; cascades to pod, threads into session.can_view_schedule/can_observe_recording)
  - {user: user:sam, relation: can_observe_sessions, object: program:p2}
  # EXT-PH-2 -> program.qtf_access (renamed from access_qtf)
  - {user: user:sue, relation: qtf_access, object: program:p2}
  # EXT-PH-2 -> session.subject (materialized/frozen subject fact)
  - {user: user:t2, relation: subject, object: session:c1}
  # EXT-DASH-6 -> can_provision_sandbox (direct grant, support-tier operator)
  - {user: user:pat, relation: can_provision_sandbox, object: saga_platform:root}
  # EXT-DASH-7 -> district.can_view_pii threaded via staff_org.staff_view_pii (per-district PII grant, non-super_admin staff)
  - {user: user:pat, relation: staff_view_pii, object: staff_org:balt}
  # EXT-AZ-1 -> saga_platform.baseline (#440 floor grant)
  - {user: user:newbie, relation: baseline, object: saga_platform:root}
  # POL-DASH-2 -> district.can_view_all_programs (non-admin, directly-assignable holder)
  - {user: user:vic, relation: can_view_all_programs, object: district:balt}
  # POL-CV3-1 -> adhoc_room (district-scoped parent, option B)
  - {user: district:balt, relation: parent_district, object: adhoc_room:ondemand1}
  - {user: user:zed, relation: host, object: adhoc_room:ondemand1}
  - {user: user:cara, relation: participant, object: adhoc_room:ondemand1}
  - {user: user:quinn, relation: observer, object: adhoc_room:ondemand1}

  # --- D2: school as first-class object -- a school mapped to BOTH p1 and p2 ---
  - {user: program:p1, relation: program, object: school:oakview}
  - {user: program:p2, relation: program, object: school:oakview}
  - {user: user:cody, relation: can_coordinate, object: school:oakview}
  - {user: school:oakview, relation: parent_school, object: grade_upload:g-oakview-001}

  # --- D3: coach viewee-class scoping (DPP/IPM/DA matrix) ---
  - {user: user:diane, relation: can_view_coaching_of_coordinators, object: district:balt}   # DPP bundle: coordinators+ipms, not tutors, district-scoped
  - {user: user:diane, relation: can_view_coaching_of_ipms, object: district:balt}
  - {user: user:dana, relation: can_view_coaching_of_tutors, object: district:balt}       # DA bundle: all three, district-scoped so it cascades everywhere
  - {user: user:dana, relation: can_view_coaching_of_coordinators, object: district:balt}
  - {user: user:dana, relation: can_view_coaching_of_ipms, object: district:balt}
  - {user: program:p1, relation: parent_program_as_ipm, object: coach_progress:ida}
  - {user: user:ida, relation: subject, object: coach_progress:ida}

  # --- D4/D4b: ad-hoc pod creation ---
  - {user: user:ines, relation: can_create_pod, object: program:p1}                        # IPM/DA bundle: any pod, any host
  - {user: user:t1, relation: can_create_pod_hosted_by_self, object: program:p1}           # tutor bundle: app enforces host == caller

  # --- D6: retained host, no district affiliation (simulates a departed host) ---
  - {user: pod:a, relation: parent_pod, object: session:tex1}
  - {user: user:tex, relation: host, object: session:tex1}

  # --- D7: district-scoped QTF grant, IPM-bundle program creation, directory read ---
  - {user: user:dana, relation: qtf_access, object: district:balt}
  - {user: user:ines, relation: can_create_program, object: district:balt}
  - {user: user:ines, relation: can_view_directory, object: district:balt}

  # --- D8: delegated grant without full district edit ---
  - {user: user:gary, relation: can_grant, object: district:balt}

tests:
  # ======================================================================
  # EXT-PH-1 -> pod.can_edit_sessions / session.can_edit + session.can_release
  # ======================================================================
  - name: EXT-PH-1 session.can_edit -- host yes, IPM yes, pod-mate tutor no, participant no
    check:
      - user: user:t1                 # host
        object: session:a1
        assertions: {can_edit: true}
      - user: user:ines               # can_edit of p1 -> pod:b.can_edit_sessions -> session:b1.can_edit
        object: session:b1
        assertions: {can_edit: true}
      - user: user:t2                 # tutor of pod:b/pod:c ("pod-mate" tutor elsewhere) -- NOT tutor of pod:a, not host
        object: session:a1
        assertions: {can_edit: false}
      - user: user:cara                # participant only
        object: session:a1
        assertions: {can_edit: false}
      - user: user:t1                 # not tutor of pod:b, not host, not ipm-equivalent
        object: session:b1
        assertions: {can_edit: false}
      - user: user:ines               # p2 session, ines has no grant on p2
        object: session:c1
        assertions: {can_edit: false}
  - name: EXT-PH-1 session.can_release -- grant-holder yes, host no (grant-holders only, never host)
    check:
      - user: user:ines
        object: session:a1
        assertions: {can_release: true}
      - user: user:t1
        object: session:a1
        assertions: {can_release: false}

  - name: EXT-PH-1-CTX unmaterialized session resolves host/pod via contextual tuples only
    tuples:
      - {user: pod:c, relation: parent_pod, object: "session:2026-09-10-c-slot3"}
      - {user: user:t2, relation: host, object: "session:2026-09-10-c-slot3"}
    check:
      - user: user:t2
        object: "session:2026-09-10-c-slot3"
        assertions: {can_edit: true, can_view_schedule: true}
      - user: user:ines               # ines can_edit p1, pod:c is under p2
        object: "session:2026-09-10-c-slot3"
        assertions: {can_edit: false}
      - user: user:ivan               # ivan holds can_edit on p2 directly -> grant arm, no host tuple needed
        object: "session:2026-09-10-c-slot3"
        assertions: {can_edit: true}

  # ======================================================================
  # SOA-08 -- D19 attribution: host / supervise_view / staff_observe stay separable
  # ======================================================================
  - name: SOA-08 D19 attribution stays separable
    check:
      - user: user:t2
        object: session:b1
        assertions: {can_view_schedule: true, can_release: false}
      - user: user:ines
        object: session:b1
        assertions: {can_view_schedule: true, can_release: true}
      - user: user:pat
        object: session:b1
        assertions: {can_view_schedule: true, can_release: false, can_observe_recording: true}

  # ======================================================================
  # EXT-CV3-1 -- session.participant (materialized) + contextual present/absent/wrong-pod
  # ======================================================================
  - name: EXT-CV3-1 materialized participant sees own session, not host-only/grant actions, not another session
    check:
      - user: user:cara
        object: session:a1
        assertions: {can_view_schedule: true, can_release: false, can_edit: false, can_observe_recording: false}
      - user: user:cara
        object: session:b1
        assertions: {can_view_schedule: false}

  - name: EXT-CV3-1 contextual -- present participant sees own occurrence, absent-override gets no tuple, wrong pod stays invisible
    tuples:
      - {user: pod:a, relation: parent_pod, object: "session:e1"}
      - {user: user:t1, relation: host, object: "session:e1"}
      - {user: user:cara, relation: participant, object: "session:e1"}      # cara present at this occurrence
      - {user: pod:a, relation: parent_pod, object: "session:e2"}
      - {user: user:t1, relation: host, object: "session:e2"}               # cara marked ABSENT here -- no participant tuple written
      - {user: pod:b, relation: parent_pod, object: "session:e3"}
      - {user: user:t2, relation: host, object: "session:e3"}               # a different pod's occurrence entirely
    check:
      - user: user:cara
        object: "session:e1"
        assertions: {can_view_schedule: true}
      - user: user:cara
        object: "session:e2"
        assertions: {can_view_schedule: false}
      - user: user:cara
        object: "session:e3"
        assertions: {can_view_schedule: false}

  # ======================================================================
  # EXT-CV3-2 -- session.observer (contextual)
  # ======================================================================
  - name: EXT-CV3-2 assigned observer without program supervise_view
    tuples:
      - {user: user:quinn, relation: observer, object: session:d1}
    check:
      - user: user:quinn
        object: session:d1
        assertions: {can_view_schedule: true}
      - user: user:quinn
        object: session:c1          # no observer tuple written here
        assertions: {can_view_schedule: false}

  # ======================================================================
  # EXT-PH-4 -- program.can_observe_sessions (+ pod passthrough): sessions yes, school/grade/release no
  # ======================================================================
  - name: EXT-PH-4 program observer sees pod/session under the observed program but gains no school/grade/release reach
    check:
      - user: user:sam
        object: session:c1
        assertions: {can_view_schedule: true, can_release: false, can_observe_recording: true}
      - user: user:sam
        object: pod:c
        assertions: {can_view: true}    # v1.1: pod.can_view gained the observer arm (was a MODEL-FINDING in v1)
      - user: user:sam
        object: school:p2-s2
        assertions: {can_view: false}         # sam is NOT coordinator here (only p1-s1) -- observing sessions must not confer this
      - user: user:sam
        object: grade_upload:g-p2s2-001
        assertions: {can_write: false}        # observer alone must not confer grade-upload write

  # ======================================================================
  # EXT-PH-2 -- program.qtf_access (renamed from access_qtf) + session.subject
  # ======================================================================
  - name: EXT-PH-2 qtf_access holder authors/reads/sets-next-steps; subject self-authors/reads only, never sets next steps; unrelated tutor fails closed
    check:
      - user: user:sue                # qtf_access on program:p2, not the subject
        object: session:c1
        assertions: {can_author_observation: true, can_read_observation: true, can_set_next_steps: true}
      - user: user:t2                 # subject of session:c1 (materialized), no qtf_access
        object: session:c1
        assertions: {can_author_observation: true, can_read_observation: true, can_set_next_steps: false}
      - user: user:t3                 # no subject tuple, no qtf_access on p2 -> fail closed
        object: session:d1
        assertions: {can_author_observation: false, can_read_observation: false}

  # ======================================================================
  # can_observe_recording -- excludes participant, includes support and program observer
  # ======================================================================
  - name: can_observe_recording excludes participant, includes support and program observer
    check:
      - user: user:cara
        object: session:a1
        assertions: {can_observe_recording: false}
      - user: user:pat
        object: session:c1
        assertions: {can_observe_recording: true}
      - user: user:sam
        object: session:c1
        assertions: {can_observe_recording: true}

  # ======================================================================
  # POL-CV3-1 -- adhoc_room: host/participant see it, IPM does NOT, support does via staff_observe
  # ======================================================================
  - name: POL-CV3-1 adhoc_room -- host/participant/observer see it, IPM never does, support reaches via staff_observe
    check:
      - user: user:zed
        object: adhoc_room:ondemand1
        assertions: {can_view: true, can_observe_recording: true}
      - user: user:cara
        object: adhoc_room:ondemand1
        assertions: {can_view: true, can_observe_recording: false}   # participant excluded from recording, same as session
      - user: user:quinn
        object: adhoc_room:ondemand1
        assertions: {can_view: true, can_observe_recording: true}
      - user: user:ines
        object: adhoc_room:ondemand1
        assertions: {can_view: false}
      - user: user:ivan
        object: adhoc_room:ondemand1
        assertions: {can_view: false}
      - user: user:pat
        object: adhoc_room:ondemand1
        assertions: {can_view: true, can_observe_recording: true}

  # ======================================================================
  # POL-DASH-2 -- district.can_view_all_programs cascades into program.can_view only,
  # NOT supervise_view/can_edit, and does not reach sessions.
  # ======================================================================
  - name: POL-DASH-2 can_view_all_programs holder sees program.can_view district-wide but nothing deeper
    check:
      - user: user:vic
        object: program:p2
        assertions: {can_view: true, supervise_view: false, can_edit: false}
      - user: user:vic
        object: program:p1
        assertions: {can_view: true}
      - user: user:vic
        object: session:c1
        assertions: {can_view_schedule: false}

  # ======================================================================
  # EXT-DASH-1/EXT-DASH-2/EXT-IAM-3/EXT-DASH-7 -- district staff-relations matrix
  # ======================================================================
  - name: district staff relations -- create_program (can_edit-holder only), manage_admins/upload_roster/download_roster/view_pii (staff-threaded)
    check:
      - user: user:dana               # district can_edit holder
        object: district:balt
        assertions: {can_create_program: true, can_manage_admins: false, can_upload_roster: true, can_download_roster: true, can_view_pii: true}
      - user: user:oscar              # org_admin staff -> staff_admin via can_admin_personas
        object: district:balt
        assertions: {can_create_program: false, can_manage_admins: true, can_upload_roster: true, can_download_roster: true, can_view_pii: false}
      - user: user:pat                # support, with a direct per-district staff_view_pii grant only
        object: district:balt
        assertions: {can_create_program: false, can_manage_admins: false, can_upload_roster: false, can_download_roster: false, can_view_pii: true}
      - user: user:t1                 # plain tutor
        object: district:balt
        assertions: {can_create_program: false, can_manage_admins: false, can_upload_roster: false, can_download_roster: false, can_view_pii: false}

  # ======================================================================
  # staff plane relations -- can_flip_prod_color / can_provision_sandbox / can_query_analytics /
  # can_audit_authz / can_view_audit / baseline / can_manage_coach_playlists
  # ======================================================================
  - name: staff plane relations matrix
    check:
      - user: user:oscar               # org_admin
        object: saga_platform:root
        assertions: {can_flip_prod_color: true, can_provision_sandbox: true, can_query_analytics: false, can_audit_authz: false, can_view_audit: true, baseline: false, can_manage_coach_playlists: true}
      - user: user:pat                 # support (+ direct can_provision_sandbox, staff_view_pii grants)
        object: saga_platform:root
        assertions: {can_flip_prod_color: false, can_provision_sandbox: true, can_query_analytics: true, can_audit_authz: true, can_view_audit: false, baseline: false, can_manage_coach_playlists: false}
      - user: user:t1                  # plain tutor, no staff role
        object: saga_platform:root
        assertions: {can_flip_prod_color: false, can_provision_sandbox: false, can_query_analytics: false, can_audit_authz: false, can_view_audit: false, baseline: false, can_manage_coach_playlists: false}
      - user: user:newbie              # EXT-AZ-1: org-less new user, real baseline tuple only
        object: saga_platform:root
        assertions: {baseline: true, can_flip_prod_color: false, can_provision_sandbox: false}

  # ======================================================================
  # EXT-COACH-1 -- coach_progress.can_view_responses (per-person keying, viewee-class edges to p1 AND p2)
  # ======================================================================
  - name: EXT-COACH-1 coach_progress.can_view_responses -- IPM-bundle holder of any linked program yes, non-supervising SC no, subject yes for own
    check:
      - user: user:ines               # can_view_coaching_of_tutors on p1 only
        object: coach_progress:t2     # parent_program_as_tutor edges to BOTH p1 and p2
        assertions: {can_view_responses: true}
      - user: user:sam                # coordinator only, no coaching-view capability anywhere
        object: coach_progress:t2
        assertions: {can_view_responses: false}
      - user: user:t2                 # subject, own record
        object: coach_progress:t2
        assertions: {can_view_responses: true}

  # ======================================================================
  # D2 -- school as first-class object: two-program school, mapping-edge reach, scoped reports
  # ======================================================================
  - name: D2 coordinator at a two-program school sees reports/uploads with one grant, regardless of program count
    check:
      - user: user:cody
        object: school:oakview
        assertions: {can_coordinate: true, can_upload_grades: true, can_view_reports: true}
      - user: user:cody
        object: grade_upload:g-oakview-001
        assertions: {can_write: true}

  - name: D2 a program supervisor reaches a shared school through either mapping edge; scoping stays school-shaped, not program-shaped
    check:
      - user: user:ivan               # can_edit on BOTH p1 and p2
        object: school:oakview
        assertions: {can_upload_grades: true, can_view_reports: true}
      - user: user:ines               # can_edit on p1 only -- reaches oakview via the p1 edge alone (the intended D2 reach, unreachable pre-D2)
        object: grade_upload:g-oakview-001
        assertions: {can_write: true}
      - user: user:sam                # participant only, holds no capability on either program mapped to oakview
        object: school:oakview
        assertions: {can_view: false}

  # ======================================================================
  # D3 -- coach viewee-class scoping: IPM / DPP / DA see different populations
  # ======================================================================
  - name: D3 viewee-class scoping -- IPM sees tutors+coordinators not IPMs; DPP sees coordinators+IPMs not tutors; DA sees all three
    check:
      - user: user:ines               # IPM bundle: tutors + coordinators on p1
        object: coach_progress:t1
        assertions: {can_view: true}
      - user: user:ines
        object: coach_progress:sam
        assertions: {can_view: true}
      - user: user:ines
        object: coach_progress:ida
        assertions: {can_view: false}
      - user: user:diane               # DPP bundle: coordinators + ipms on p1
        object: coach_progress:sam
        assertions: {can_view: true}
      - user: user:diane
        object: coach_progress:ida
        assertions: {can_view: true}
      - user: user:diane
        object: coach_progress:t1
        assertions: {can_view: false}
      - user: user:dana                # DA bundle: all three, granted at district scope
        object: coach_progress:t1
        assertions: {can_view: true}
      - user: user:dana
        object: coach_progress:sam
        assertions: {can_view: true}
      - user: user:dana
        object: coach_progress:ida
        assertions: {can_view: true}

  # ======================================================================
  # D4/D4b -- ad-hoc pod creation (grant vs self-host) + host-only can_reassign_host denial
  # ======================================================================
  - name: D4 ad-hoc pod creation -- grant-holder creates any pod, self-host tutor only creates one they will host
    check:
      - user: user:ines
        object: program:p1
        assertions: {can_create_pod: true, can_create_pod_hosted_by_self: false}
      - user: user:t1
        object: program:p1
        assertions: {can_create_pod: false, can_create_pod_hosted_by_self: true}
      - user: user:ines
        object: program:p2
        assertions: {can_create_pod: false}

  - name: D4b host-only actor may edit their session but not reassign its host
    check:
      - user: user:t1                  # host of session:a1, no can_edit_sessions grant on pod:a
        object: session:a1
        assertions: {can_edit: true, can_reassign_host: false}
      - user: user:ines                # can_edit on p1 -> pod:a.can_edit_sessions via the grant arm
        object: session:a1
        assertions: {can_edit: true, can_reassign_host: true}

  # ======================================================================
  # D5 -- join/view relations: one assertion per new relation
  # ======================================================================
  - name: D5 join/view relations -- one assertion per new relation
    tuples:
      - {user: user:quinn, relation: observer, object: session:d1}
    check:
      - user: user:t1
        object: session:a1
        assertions: {can_join_as_host: true, can_join_as_participant: false, can_join_as_observer: false}
      - user: user:cara
        object: session:a1
        assertions: {can_join_as_participant: true, can_join_as_host: false}
      - user: user:quinn
        object: session:d1
        assertions: {can_join_as_observer: true, can_join_as_host: false}
      - user: user:ines                # supervise_view from parent_pod qualifies as an observer-mode joiner without a session.observer tuple
        object: session:b1
        assertions: {can_join_as_observer: true}
      - user: user:cara                 # participant only -- excluded from the session's recorded outcome
        object: session:a1
        assertions: {can_view_outcome: false}
      - user: user:t1                   # host of their own session -- can see its outcome
        object: session:a1
        assertions: {can_view_outcome: true}

  # ======================================================================
  # D6 -- a retained host loses can_view_own_hosted once no longer affiliated with the district
  # ======================================================================
  - name: D6 a retained host loses the retained view (but keeps can_edit) once the affiliate tuple is gone
    check:
      - user: user:t1                   # host, affiliate tuple present
        object: session:a1
        assertions: {can_view_schedule: true, can_observe_recording: true, can_edit: true}
      - user: user:tex                  # host, NO affiliate tuple (simulates a departed host)
        object: session:tex1
        assertions: {can_view_schedule: false, can_observe_recording: false, can_edit: true}

  # ======================================================================
  # D7 -- district-scoped QTF grant, IPM-bundle program creation, directory read
  # ======================================================================
  - name: D7 district-scoped QTF cascades to every program; IPM-bundle creates programs; directory read is its own scoped capability
    check:
      - user: user:dana                 # qtf_access granted at district scope
        object: program:p1
        assertions: {qtf_access: true}
      - user: user:dana
        object: program:p2
        assertions: {qtf_access: true}
      - user: user:sue                  # unaffected direct program-level qtf_access grant, coexists with the district cascade
        object: program:p2
        assertions: {qtf_access: true}
      - user: user:ines                 # IPM-bundle direct grant, not a district can_edit holder
        object: district:balt
        assertions: {can_create_program: true, can_view_directory: true}
      - user: user:t1
        object: district:balt
        assertions: {can_create_program: false, can_view_directory: false}

  # ======================================================================
  # D8 -- delegated grant without full district edit
  # ======================================================================
  - name: D8 a delegated granter can_grant without holding can_edit
    check:
      - user: user:gary
        object: district:balt
        assertions: {can_grant: true, can_edit: false}
      - user: user:t1
        object: district:balt
        assertions: {can_grant: false}

  # ======================================================================
  # check/list parity -- session.can_view_schedule per subject, recomputed under v1.2 (observer/participant additions)
  # ======================================================================
  - name: check/list parity -- sessions visible per subject under v1.2
    list_objects:
      - user: user:ines
        type: session
        assertions:
          can_view_schedule: [session:a1, session:b1, session:tex1, session:x1]
      - user: user:t1
        type: session
        assertions:
          can_view_schedule: [session:a1]
      - user: user:t2
        type: session
        assertions:
          can_view_schedule: [session:b1, session:c1]
      - user: user:dana
        type: session
        assertions:
          can_view_schedule: [session:a1, session:b1, session:c1, session:d1, session:tex1, session:x1]
      - user: user:cara               # NEW: materialized participant on session:a1 only
        type: session
        assertions:
          can_view_schedule: [session:a1]
      - user: user:sam                # NEW: program:p2 can_observe_sessions -> pod:c/pod:d -> session:c1, session:d1
        type: session
        assertions:
          can_view_schedule: [session:c1, session:d1]
  - name: check/list parity -- program.can_view for the can_view_all_programs holder
    list_objects:
      - user: user:vic
        type: program
        assertions:
          can_view: [program:p1, program:p2]
