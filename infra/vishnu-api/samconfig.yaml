version: 0.1
bootstrap-dev:
  deploy:
    parameters:
      stack_name: soa-vishnu-api-bootstrap-dev
      template_file: infra/vishnu-api/bootstrap-template.yaml
      region: us-west-2
      capabilities:
      - CAPABILITY_NAMED_IAM
      confirm_changeset: true
      parameter_overrides:
      - Environment=dev
      - VpcIdSSMParameter=/shared/infra/dev/vpc-id
      - ALBSecurityGroupIdSSMParameter=/shared/infra/dev/app-alb-sg-id
      - DatadogApiKeyArn=arn:aws:secretsmanager:us-west-2:396913734878:secret:datadog/api-key/default-mj4116
      - DatadogAppKeyArn=arn:aws:secretsmanager:us-west-2:396913734878:secret:soa/vishnu/dev/datadog-app-key-ilOgHK
routing-dev-blue:
  deploy:
    parameters:
      stack_name: soa-vishnu-api-blue-routing
      template_file: infra/shared/routing-template.yaml
      region: us-west-2
      capabilities:
      - CAPABILITY_NAMED_IAM
      confirm_changeset: true
      parameter_overrides:
      - Environment=dev
      - ProjectName=soa
      - ServiceName=vishnu-api
      - Identifier=blue
      - ContainerPort=8931
      - HealthCheckPath=/health/ready
      - HostHeader=vishnu.wootops.org
      - TargetGroupName=vishnu-api-blue-tg
      - VpcIdSSMParameter=/shared/infra/dev/vpc-id
      - ALBListenerArnSSMParameter=/shared/infra/dev/app-alb-443-listener-arn
dev:
  deploy:
    parameters:
      stack_name: soa-vishnu-api-blue
      template_file: infra/shared/service-template.yaml
      region: us-west-2
      capabilities:
      - CAPABILITY_NAMED_IAM
      confirm_changeset: true
      parameter_overrides:
      - Identifier=blue
      - ExecEnv=dev
      - ClusterArnSSMParameter=/dev/shared-arm/ecs-cluster-arn
      - SubnetIdsSSMParameter=/shared/infra/dev/private-subnet-ids
      - SecurityGroupIdSSMParameter=/soa/vishnu-api/infra/dev/sg-id
      - TargetGroupArnSSMParameter=/soa/vishnu-api/infra/dev/blue/target-group-arn
      - ExecutionRoleArnSSMParameter=/soa/vishnu-api/infra/dev/execution-role-arn
      - TaskRoleArnSSMParameter=/soa/vishnu-api/infra/dev/task-role-arn
      - LogGroupSSMParameter=/soa/vishnu-api/infra/dev/log-group
      - CapacityProviderName=dev-shared-ec2-cluster-arm-capacity-provider
      - DatadogApiKeyArn=arn:aws:secretsmanager:us-west-2:396913734878:secret:datadog/api-key/default-mj4116
      - DatadogAppKeyArn=arn:aws:secretsmanager:us-west-2:396913734878:secret:soa/vishnu/dev/datadog-app-key-ilOgHK
      - DesiredCount=1
